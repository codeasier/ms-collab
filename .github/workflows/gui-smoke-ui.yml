name: GUI smoke session UI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-smoke-session-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gui-ui-unit:
    name: GUI smoke session UI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test GUI host integration and safe view contracts
        run: |
          python3 -m unittest discover -s packages/gui_smoke_ui/tests -v
          python3 -m unittest discover -s packages/gui_smoke/tests -v
          python3 -m unittest discover -s packages/application_host/tests -v
          node --test frontend/gui-smoke/tests/client.test.mjs

  gui-ui-browser:
    name: GUI smoke HTTPS browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked temporary browser tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gui-smoke-browsers
        run: |
          mkdir -p "$RUNNER_TEMP/gui-smoke-tools"
          cp scripts/browser/package.json scripts/browser/package-lock.json "$RUNNER_TEMP/gui-smoke-tools/"
          npm ci --prefix "$RUNNER_TEMP/gui-smoke-tools" --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/gui-smoke-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Accept synthetic local HTTPS and session UI
        env:
          NODE_PATH: ${{ runner.temp }}/gui-smoke-tools/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gui-smoke-browsers
          SCREENSHOT_DIR: gui-smoke-screenshots
        run: node frontend/gui-smoke/tests/browser.cjs
      - name: Upload synthetic acceptance screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-ui-screenshots
          path: gui-smoke-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
