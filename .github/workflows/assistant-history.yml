name: Assistant saved history CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assistant-history-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Synthetic saved events, authorization, lifecycle and loopback HTTP
        run: python3 -m unittest discover -s packages/assistant_history/tests -v
      - name: Shared identity and transactional policy regressions
        run: |
          python3 -m unittest discover -s packages/identity/tests -v
          python3 -m unittest discover -s packages/workspace_api/tests -v
          python3 -m unittest discover -s packages/workspaces/tests -v
