name: Community authorized API CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  community-api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s packages/community_api/tests -v
      - run: python3 -m unittest discover -s packages/community_board/tests -v
      - run: python3 -m unittest discover -s packages/workspace_api/tests -v
      - run: python3 -m unittest discover -s packages/workspaces/tests -v
