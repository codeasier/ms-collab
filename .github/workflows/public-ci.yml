name: Public CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifact-catalog-tests:
    name: Artifact catalog and view tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test scoped quarter catalogs and named filters
        run: |
          test -f packages/artifacts/tests/test_catalog.py
          python3 -m unittest discover -s packages/artifacts/tests -v

  identity-boundary-tests:
    name: Trusted identity boundary tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test fail-closed identity adapter contract
        run: |
          test -f packages/identity/tests/test_boundary.py
          python3 -m unittest discover -s packages/identity/tests -v

  workspace-policy-tests:
    name: Workspace policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test workspace policy and revocation barriers
        run: |
          test -f packages/workspaces/tests/test_service.py
          python3 -m unittest discover -s packages/workspaces/tests -v

  community-board-tests:
    name: Community board contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test community-board read model
        run: |
          test -f packages/community_board/tests/test_board.py
          python3 -m unittest discover -s packages/community_board/tests -v
      - name: Exercise synthetic CLI
        run: python3 -m packages.community_board product-alpha > /dev/null

  repository-checks:
    name: Repository safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate public repository content
        run: python3 scripts/ci/check_repository.py
      - name: Test repository checker
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  demo-tests:
    name: Demo tests when present
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test Python demo if migrated
        shell: bash
        run: |
          if [ -d backend ]; then
            test -d backend/tests
            test -n "$(find backend/tests -type f -name 'test_*.py' -print -quit)"
            python3 -m unittest discover -s backend/tests -v
          else
            echo 'Backend not migrated in this revision; no backend tests executed.'
          fi
      - name: Test frontend demo if migrated
        shell: bash
        run: |
          if [ -d frontend ]; then
            node --test frontend/tests/*.test.mjs
          else
            echo 'Frontend not migrated in this revision; no frontend tests executed.'
          fi

  browser-smoke:
    name: Synthetic browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked browser tooling in temporary directory
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-collab-browser-binaries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ms-collab-browser-tools"
          cp scripts/browser/package.json scripts/browser/package-lock.json "$RUNNER_TEMP/ms-collab-browser-tools/"
          npm ci --prefix "$RUNNER_TEMP/ms-collab-browser-tools" --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/ms-collab-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise synthetic loopback demo
        env:
          NODE_PATH: ${{ runner.temp }}/ms-collab-browser-tools/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-collab-browser-binaries
        run: node frontend/checks/browser-smoke.cjs
      - name: Upload only the synthetic acceptance screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-screenshots
          path: |
            ${{ runner.temp }}/ms-collab-browser/desktop.png
            ${{ runner.temp }}/ms-collab-browser/mobile.png
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
