name: Configured service runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Private installation and TLS runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install exact server wheel without extras
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r deploy/requirements.txt
      - name: Test installation, backups, authority and fixed HTTP boundary
        run: |
          python -m unittest discover -s packages/service_runtime/tests -v
          python -m unittest discover -s packages/application_host/tests -v
          python -m unittest discover -s packages/session_api/tests -v
          python -m unittest discover -s packages/research_assets/tests -v
          python -m packages.service_runtime.tests.https_acceptance
