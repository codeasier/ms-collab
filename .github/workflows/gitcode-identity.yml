name: GitCode protocol checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitcode-protocol-tests:
    name: GitCode protocol safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test offline protocol, transport and closed-login boundaries
        run: |
          test -f packages/gitcode_identity/tests/test_client.py
          test -f packages/gitcode_identity/tests/test_login_gate.py
          python3 -m unittest discover -s packages/gitcode_identity/tests -v
